    <table border="0" valign="top">

            <tr>
                <td> 
                   line-width = 1Hz, 100MHz<br><br>
                   <applet name="Spectrum2" 
                        code="org.openscience.nmrshiftdb.spectrumapplet.SpectrumViewNoRenderer"

                        <param name="spectrumTyp" value= "1H">

                   line-width = 0.5Hz, 100MHz<br><br>
                   <applet name="Spectrum3" 
                        code="org.openscience.nmrshiftdb.spectrumapplet.SpectrumViewNoRenderer"

                        width="450" height="350">
                        
                        <param name="spectrumTyp" value= "1H">
                        <param name="lineWidth" value= "0.5">
                        <param name="spectrum"
