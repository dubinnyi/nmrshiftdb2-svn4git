openapi: 3.0.0

info:
  title: Molecule Service
  version: 0.1.0

servers:
  - url: https://nmrshiftdb.nmr.uni-koeln.de/NmrshiftdbServlet/nmrshiftdbaction
    description: Main (production) server
  - url: http://sdbtest.nmr.uni-koeln.de/nmrshiftdb/NmrshiftdbServlet/nmrshiftdbaction
    description: Internal staging server for testing

paths:
  /predict/smiles/{smiles}/spectrumtype/{type}:
    get:
      summary: Predict NMR shifts
      parameters:
        - in: path
          name: smiles
          schema:
            type: string
          required: true
          description: A valid SMILES. Can contain @ configurations. Explicit Hs are optional.
        - in: path
          name: type
          schema:
            type: string
          required: true
          description: A nucleus to predict. All nuclei in nmrshiftdb2 are allowd. Format is e.g. 13c, 1H. Use getSpectrumTypes to get a list.
        - in: query
          name: format
          schema:
            type: string
          required: false
          description: A format, either cml (for Chemical Markup Language) or jcamp (for JCAMP-DX). cml is default
        - in: query
          name: solvent
          schema:
            type: string
          required: false
          description: >
            Restricts prediction to a certain solvent. Solvent is ignored otherwise. 
            Realistic solvents (=solvents for which we have some data) are:
            Chloroform-D1 (CDCl3),
            Dimethylsulphoxide-D6 (DMSO-D6, C2D6SO),
            Methanol-D4 (CD3OD),
            Deuteriumoxide (D2O),
            Acetone-D6 ((CD3)2CO),
            D2O,
            TETRACHLORO-METHANE (CCl4),
            Pyridin-D5 (C5D5N),
            Benzene-D6 (C6D6)

      responses:
        '200':
          description: Prediction result, as CML.

  /searchorpredict/smiles/{smiles}/spectrumtype/{type}:
    get:
      summary: Searches for a structure or predicts NMR shifts, if none found.
      parameters:
        - in: path
          name: smiles
          schema:
            type: string
          required: true
          description: A valid SMILES. Can contain @ configurations. Explicit Hs are optional.
        - in: path
          name: type
          schema:
            type: string
          required: true
          description: A nucleus to predict. All nuclei in nmrshiftdb2 are allowd. Format is e.g. 13c, 1H.
        - in: query
          name: format
          schema:
            type: string
          required: false
          description: A format, either cml (for Chemical Markup Language) or jcamp (for JCAMP-DX). cml is default
        - in: query
          name: solvent
          schema:
            type: string
          required: false
          description: >
            Restricts prediction to a certain solvent. Solvent is ignored otherwise. 
            Realistic solvents (=solvents for which we have some data) are:
            Chloroform-D1 (CDCl3),
            Dimethylsulphoxide-D6 (DMSO-D6, C2D6SO),
            Methanol-D4 (CD3OD),
            Deuteriumoxide (D2O),
            Acetone-D6 ((CD3)2CO),
            D2O,
            TETRACHLORO-METHANE (CCl4),
            Pyridin-D5 (C5D5N),
            Benzene-D6 (C6D6)

      responses:
        '200':
          description: Search or prediction result, as CML.

  /searchstructure/smiles/{smiles}:
    get:
      summary: Searches for a structure by a structure.
      parameters:
        - in: path
          name: smiles
          schema:
            type: string
          required: true
          description: A valid SMILES. Can contain @ configurations. Explicit Hs are optional.
        - in: query
          name: type
          schema:
            type: string
          required: false
          description: If given, a spectrum of that nucleus must exist for the structure.
        - in: query
          name: format
          schema:
            type: string
          required: false
          description: A format, either cml (for Chemical Markup Language) or jcamp (for JCAMP-DX). cml is default
        - in: query
          name: mode
          schema:
            type: string
          required: false
          description: A search mode, either "exact" (default), "substructure", or "similarity".
        - in: query
          name: solvent
          schema:
            type: string
          required: false
          description: >
            Restricts prediction to a certain solvent. Solvent is ignored otherwise. 
            Realistic solvents (=solvents for which we have some data) are:
            Chloroform-D1 (CDCl3),
            Dimethylsulphoxide-D6 (DMSO-D6, C2D6SO),
            Methanol-D4 (CD3OD),
            Deuteriumoxide (D2O),
            Acetone-D6 ((CD3)2CO),
            D2O,
            TETRACHLORO-METHANE (CCl4),
            Pyridin-D5 (C5D5N),
            Benzene-D6 (C6D6)

      responses:
        '200':
          description: Prediction result, as CML.

  /dereplicate/searchspectrum/{searchspectrum}:
    get:
      summary: Search by NMR shifts (dereplication)
      parameters:
        - in: path
          name: searchspectrum
          schema:
            type: string
          required: true
          description: The spectrum to search. Must be formatted like "54|76|87|". For 13C/1H correlation, it must be like "56.2;2.2|64.1;2.6|".
        - in: query
          name: subspectrum
          schema:
            type: string
          required: false
          description: A search mode, "sub"=subspectrum search, "whole"=total spectrum search (default).
        - in: query
          name: spectrumtype
          schema:
            type: string
          required: false
          description: A spectrum type to search, e.g. 13C (default), 1H. "13C/1H correlation" does a correlation search.

      responses:
        '200':
          description: Search result, as CML.

  /getUserNumber:
    get:
      summary: Gets the current number of users.
      parameters: []

      responses:
        '200':
          description: The number of users currently active on this server.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  
  /getSpectrumTypes:
    get:
      summary: Gets the types of spectra existing on this server.
      parameters: []

      responses:
        '200':
          description: The spectrum types currently existing on this server.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /doSearch/searchfield/{searchfield}/searchstring/{searchstring}:
    get:
      summary: Search by metadata
      parameters:
        - in: path
          name: searchfield
          schema:
            type: string
          required: true
          description: The field to search in. See NmrshiftdbConstants.SUBSTRUCTURE_SIMILARITY to SUBSTKEYWORD for potential values.
        - in: path
          name: searchstring
          schema:
            type: string
          required: true
          description: The value to search for, as formatted as the input in the searchfield of the web interface.
        - in: query
          name: searchtype
          schema:
            type: string
          required: false
          description: The type of search, either "exact" (default), "regular expression", or "fuzzy".

      responses:
        '200':
          description: Search result, as CMLMoleculeList.

  /doPublish/username/{username}/password/{password}:
    post:
      summary: Publishes an entry (only relevant for private repositories)
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
          description: Name of the user publishing.
        - in: path
          name: password
          schema:
            type: string
          required: true
          description: password of the user publishing.
        - in: query
          name: topublish
          schema:
            type: string
          required: false
          description: The content to publish, a CMLCml text.

      responses:
        '200':
          description: 0=Success, 2=ID already exists, 1=database problem.

  /doSubmit/username/{username}/password/{password}:
    post:
      summary: Submits an entry
      parameters:
        - in: path
          name: username
          schema:
            type: string
          required: true
          description: Name of the user publishing.
        - in: path
          name: password
          schema:
            type: string
          required: true
          description: password of the user publishing.
        - in: query
          name: tosubmit
          schema:
            type: string
          required: false
          description: The content to submit, a CMLCml text.

      responses:
        '200':
          description: The spectrum id of the entry.
          
  /doAssignment:
    get:
      summary: Performs an assignment of a spectrum to a given structure.
      parameters:
        - in: query
          name: toassign
          schema:
            type: string
          required: false
          description: The content to assign, a CMLCml text.

      responses:
        '200':
          description: The cml with assignments added.

  /rss:
    get:
      summary: Gets the latest additions as an rss feed.
      parameters:
        - in: query
          name: numbertoexport
          schema:
            type: integer
          required: false
          description: The number of entries to download, max. 20. Default is 10

      responses:
        '200':
          description: The RSS feed.

  /rssmine:
    get:
      summary: Gets the latest submissions of a user as an rss feed.
      parameters:
        - in: query
          name: numbertoexport
          schema:
            type: integer
          required: false
          description: The number of entries to download, max. 20. Default is 10
        - in: path
          name: user
          schema:
            type: string
          required: true
          description: Your user name

      responses:
        '200':
          description: The RSS feed.

  /exportcmlbyinchi:
    get:
      summary: Gets a structure and spectrum as CML or jcamp.
      parameters:
        - in: query
          name: format
          schema:
            type: string
          required: false
          description: Format for response, either jcamp (default) or cml.
        - in: path
          name: inchi
          schema:
            type: string
          required: true
          description: The inchi of the compound to search for
        - in: path
          name: spectrumtype
          schema:
            type: string
          required: true
          description: A nucleus for the spectrum to search. All nuclei in nmrshiftdb2 are allowd. Format is e.g. 13c, 1H. Use getSpectrumTypes to get a list.

      responses:
        '200':
          description: The result. An error message, if nothing (structure or spectrum) was found.

  /quickcheck:
    post:
      summary: Performs a quick check. Returns predicted and experimental chemical shifts together with assignment statistics and HOSE-code information used during prediction.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickCheckRequest'
            
      responses:
        '200':
          description: QuickCheck results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickCheckResponse'

components:
  schemas:

    Input:
      type: object
      required:
        - id
        - type
        - shifts
      properties:
        id:
          type: integer
          example: 1

        type:
          type: string
          description: |
            Experiment type.

            Supported values include:
            - nmr;13C;1d
            - nmr;1H;1d
            - nmr;hsqc;2d
            - nmr;hmbc;2d
            - nmr;cosy;2d
            - ms

        shifts:
          type: string
          description: |
            Experimental data encoded as a string.

            Examples:
            13C NMR: "117;123;103"
            HSQC: "7.11,117;7.32,123;6.46,103"
            MS: "1;2;3"

        solvent:
          type: string
          description: Solvent used during acquisition.
          example: Chloroform-D1 (CDCl3)

    QuickCheckRequest:
      type: object
      required:
        - moltxt
        - inputs
      properties:
        moltxt:
          type: string
          description: MDL Molfile representation of the structure.

        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Input'

    QuickCheckResponse:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/PredictionSet'

    PredictionSet:
      type: object
      properties:
        id:
          type: integer

        type:
          type: string
          example: nmr;1H;1d

        statistics:
          $ref: '#/components/schemas/PredictionStatistics'

        shifts:
          type: array
          items:
            $ref: '#/components/schemas/ShiftPrediction'

    PredictionStatistics:
      type: object
      properties:
        accept:
          type: integer
        warning:
          type: integer
        reject:
          type: integer
        missing:
          type: integer
        total:
          type: integer

    ShiftPrediction:
      type: object
      properties:
        atom:
          type: integer

        prediction:
          type: number
          format: double

        real:
          type: number
          format: double

        diff:
          type: number
          format: double

        status:
          type: string
          enum:
            - accept
            - warning
            - reject
            - missing

        hoseCode:
          type: string

        spheres:
          type: integer