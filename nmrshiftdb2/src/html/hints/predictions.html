<title>Prediction method in nmrshiftdb2</title>
</head>
<body>
There are three prediction methods in nmrshiftdb2:
<ul>
<li>3D HOSE code (default) see <a href="https://doi.org/10.1021/acsomega.9b00488">paper</a></li>
<li>SVM based (1H svm) see <a href="https://doi.org/10.1186/1471-2105-9-400">paper</a></li>
<li>Deep learning (1H NN, 13C NN) see <a href="https://jcheminf.biomedcentral.com/articles/10.1186/s13321-019-0374-3">paper</a></li>
</ul>
</body>
