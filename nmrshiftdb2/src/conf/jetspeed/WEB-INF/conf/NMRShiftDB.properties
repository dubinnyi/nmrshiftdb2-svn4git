#This determines if emails are sent to the reviewer and the contributor in order to notify about reviews
sendreviewmail=true
#Decides if and where the serialized input should be put
writeserializedtodir=false
serializeddir=/home/shk3/abcd
sendserializedemail=true
serializedemail=stefan.kuhn@uni-koeln.de
#This indicates if loadbalancing is to be used
useloadbalancing=false
#This indicates where the directory of nmrshiftdb servers used for loadbalancing is to be found
serverdirectory=http://nmrshiftdb.sf.net/nmrshiftdbservers.xml
#Gives the number of spheres to use for predictions (if changed run adminPanel/build hose code for existing data!)
hosecode.spheres=6
#This gives the start point of the current id range
myidstart=40000000
#Gives the end of the id range (first id of next range)
myidend=50000000
#Only spectra with this or higher mark are used for prediction
minimum.mark.prediction=5
#if true, spectra searches will find spectra assigned to no molecule,
#spectra searches will display spectra in overview. If false, searches for spectra 
#and spectral properties are still structure-centric
unassigned_spectra_allowed=false
#if true, a search for mixtures will be possible (else mixtures will not be handled)
#currently, this only leads to a "mixture" checkbox in structure search. No input facilities exist.
mixture_search_possible=false
#Only spectra with this or higher mark are displayed directly in details
minimum.mark.display=3
#If true, a captcha is used for registration and guestbook
usecaptcha=true
#A directory where raw files can be found, comment out if server is not for labgroup adminstration
rawfiledirectory=/home/shk3/machines
#A directory where raw files can be found for user assignment
rawfiledirectoryuser=/home/shk3/machines
#A directory where raw files can be found for robot assignment
#If this is usesftp sftp will be used for file transfer, otherwise scp
rawfiledirectoryrobot=/home/shk3/machines
#A directoy where to put compressed raw files for download
compressedfiledirectory=/export/nmrdata/nmrshiftdb
#A url to this directory
urlcompressedfiles=http://134.95.190.22/nmrshiftdbdata
#the name of the user used in iconNMR
#if USERNAME then the logged in user is used
iconnmruser=iconnmr
#if true then group names are used as prefixes and spectrometer names as postfixes
prepostfix=false
#if true then affiliations are taken from database tables and no free input is possible
fixedaffiliations=false
#if true used holders during this shift will be invalid
invalidateholder=true
#This url is used for links, if no url can be built from request. This should only be the case from web service
defaulturl=134.95.190.22/nmrshiftdb
#here the server provider can put alink shown on sponsoring.html
serverproviderlink=http://almost.cubic.uni-koeln.de
#here the server provider can put a logo shown on sponsoring.html
serverproviderlogo=siegelumr.gif
#the alt text for the serverproviderlink
serverprovideralttext=cubic
#after these months, data from labgroup will be auto published
publishaftermonths=12
#if true, image files for molecules and spectra will be saved to disk and used in later requests.
#Note the a mod_rewriet rule is needed in apache to use that. The rule must look like this:
#RewriteRule !images/(molecules|spectra)/(large|small)/[0-9_]*\.jpeg$ - [L]
#RewriteRule images/spectra/(small|large)/[0-9]*\.jpeg$ - [s=2]
#RewriteCond %{DOCUMENT_ROOT}%{REQUEST_fileNAME} !-f
#RewriteRule (.*)images/molecules/(large|small)/([0-9_]*)\.jpeg$ $1download/NmrshiftdbServlet/$3.jpg?nmrshiftdbaction=exportmol&moleculeid=$3&format=jpeg&size=$2&backcolor=14737632&shownumbers=false [L,R]
#RewriteRule (.*)images/molecules/(large|small)/([0-9_]*)\.jpeg$ - [L,PT]
#RewriteCond %{DOCUMENT_ROOT}%{REQUEST_fileNAME} !-f
#RewriteRule (.*)images/spectra/(large|small)/([0-9]*)\.jpeg$ $1download/NmrshiftdbServlet/$3.jpg?nmrshiftdbaction=exportspec&spectrumid=$3&format=jpeg&size=$2&backcolor=14737632 [L,R]
#RewriteRule (.*)images/spectra/(large|small)/([0-9]*)\.jpeg$ - [L,PT]
#RewriteRule (.*)images/spectra/original/([0-9]*)\\.[a-z]*$ $1download/NmrshiftdbServlet/$2.jpg?nmrshiftdbaction=exportspec&spectrumid=$2&format=originalimage [L,R]
#RewriteRule (.*)images/spectra/original/([0-9]*)\\.[a-z]*$ - [L,PT]
doimagecache=false
#email for csearch referee - comment out if not used
#csearchemail=geheim
#csearchsendemail=geheim
#csearchreceivehost=pop3.web.de
#csearchreceiveuser=geheim
#csearchreceivepassword=geheim
#csearchuser=geheim
#csearchpwd=geheim
#link for impressum (if not set, no link will be shown)
impressumlink=http://www.portal.uni-koeln.de/Impressum.html
#which structure input editor is used - possible values: JCP, MARVINJS (requires license), GGAKETCHER
structureeditor=MARVINJS
#this is the server to publish to automatically and default in ui
publishserver=http://nmr-sdbtest.nmr.uni-koeln.de/
#if true 2d spectra can be submitted
use2dspectra=true
#the print barcode option is only displayed for those IPs. comment out if wanted for all
ipsforprint=134.95.65.194-134.95.65.254




















